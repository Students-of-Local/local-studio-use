# Runs on every pull request and push to main: the build, types and tests, the CLI on Windows, the
# built extension in a real Chromium, an install from an empty home folder, and the market eval against its floors.
# No job gets a write token or a secret.
name: Browser

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only superseded pull request runs are cancelled; every commit on main finishes its checks.
concurrency:
  group: browser-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The compiled helper's real-executable tests (cli/test/compiled.test.mjs) need Bun.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # Clones pinned pi-mono and mini-lit into vendor/ (gitignored), applies the patch, installs.
      - name: Check out the pinned siblings and install
        run: ./scripts/setup-siblings.sh

      - name: Build
        env:
          LOCAL_STUDIO_BROWSER_NO_BUMP: "1"
        run: |
          npm run build
          (cd cli && npm run build)

      - name: Lint, type check and test
        run: |
          npx biome check .
          npx tsc --noEmit
          node scripts/check-theme.mjs
          node --import tsx --test test/*.test.mjs
          (cd cli && npx tsc --noEmit && npm test)

      - name: The local-studio-browser command answers
        working-directory: cli
        run: |
          npm link
          local-studio-browser --help > /dev/null

  # The CLI's Windows code paths: the native host registry keys, the Windows service, paths and the hub.
  cli-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    # bash, not pwsh: pwsh ends a multi-line step with its last command's exit code (test/ci-windows-shell.test.mjs).
    defaults:
      run:
        working-directory: cli
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: The Windows cases, on Windows
        run: |
          node --test test/windows-service.test.mjs test/cli.test.mjs test/socket-folder.test.mjs test/cloudflare-tunnel.test.mjs test/release-upgrade-windows.test.mjs
          node --experimental-strip-types --test test/hub-devices.test.mjs test/file-rules.test.mjs

  # The suites that drive the built extension in a real Chromium: the extension, native host and MCP server end to end
  # (test:e2e) and the side panel. The DOM benchmark runs in market-evals. Playwright's Chromium runs in the new
  # headless mode, which loads extensions, so no display server is needed.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check out the pinned siblings and install
        run: ./scripts/setup-siblings.sh

      - name: Build the extension and the CLI
        env:
          LOCAL_STUDIO_BROWSER_NO_BUMP: "1"
        run: |
          npm run build
          (cd cli && npm run build)

      - name: Install Playwright's Chromium
        working-directory: cli
        run: npx playwright-core install --with-deps chromium

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs; the tests launch Chromium directly.
      - name: Let Chromium's sandbox start
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: End-to-end bridge test
        working-directory: cli
        run: npm run test:e2e

      - name: End-to-end side panel test
        working-directory: cli
        run: npm run test:e2e:panel

  # A user's install, end to end: package the Linux release, then cli/test/clean-install.mjs installs it into an empty
  # home folder, loads the extension the installer printed and reads a page through MCP. The token lets gh check that a
  # build no release workflow attested is refused.
  clean-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Check out the pinned siblings and install
        run: ./scripts/setup-siblings.sh

      - name: Build the extension and the CLI
        env:
          LOCAL_STUDIO_BROWSER_NO_BUMP: "1"
        run: |
          npm run build
          (cd cli && npm run build)

      - name: Package the Linux release
        run: node scripts/package-release.mjs --out "$RUNNER_TEMP/release" --targets linux-x64

      - name: Install Playwright's Chromium
        working-directory: cli
        run: npx playwright-core install --with-deps chromium

      - name: Let Chromium's sandbox start
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install from an empty home folder to the first page text
        working-directory: cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: node test/clean-install.mjs --release "$RUNNER_TEMP/release"

  # The market eval (evals/market/README.md): the scores and speeds "best on the market" is measured by. The
  # DOM benchmark gates on tool calls, not wall time (a shared runner's clock is too noisy for per-case time); the
  # speed ceilings are medians measured on this runner (the market-floors workflow).
  market-evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The judge: on a pull request, the base branch's check.mjs, copied out of the checkout, so a
      # pull request that changes the check can't approve its own lower floor or skip a part of the gate.
      - name: Pick the judge
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          judge="$RUNNER_TEMP/judge/check.mjs"
          mkdir -p "$RUNNER_TEMP/judge"
          cp evals/market/check.mjs "$judge"
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth 1 origin "$BASE_SHA"
            git show "$BASE_SHA:evals/market/check.mjs" > "$judge"
          fi
          echo "MARKET_JUDGE=$judge" >> "$GITHUB_ENV"

      - name: No floor lower than on the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node "$MARKET_JUDGE" --ratchet "$BASE_SHA"

      - name: Check out the pinned siblings and install
        run: ./scripts/setup-siblings.sh

      - name: Build the extension and the CLI
        env:
          LOCAL_STUDIO_BROWSER_NO_BUMP: "1"
        run: |
          npm run build
          (cd cli && npm run build)

      - name: Install Playwright's Chromium
        working-directory: cli
        run: npx playwright-core install --with-deps chromium

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs; the tests launch Chromium directly.
      - name: Let Chromium's sandbox start
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Market eval
        run: node evals/market/run.mjs --no-check

      # --require-all: every part floors.json scores must have run.
      - name: Every score at its floor, every speed under its ceiling
        run: node "$MARKET_JUDGE" --require-all evals/market/results/last.json

      - name: Keep the run's numbers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: market-evals
          path: evals/market/results/last.json
          if-no-files-found: ignore

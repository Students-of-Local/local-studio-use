# Measures the market eval's floors on CI's own runner (evals/market/README.md, "Floors"): the eval runs 3 times, each
# on its own runner, and check.mjs --raise turns the worst of the 3 into the floors it would write. It changes nothing:
# download the market-floors artifact, copy its floors.json over evals/market/floors.json and open a pull request.
# By hand: gh workflow run browser-market-floors.yml --ref <branch>. A push to a floors/** branch runs it too, so a branch can
# be measured before this file is on main.
name: market-floors

on:
  workflow_dispatch:
  push:
    branches: ["floors/**"]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check out the pinned siblings and install
        run: ./scripts/setup-siblings.sh

      - name: Build the extension and the CLI
        env:
          LOCAL_STUDIO_BROWSER_NO_BUMP: "1"
        run: |
          npm run build
          (cd cli && npm run build)

      - name: Install Playwright's Chromium
        working-directory: cli
        run: npx playwright-core install --with-deps chromium

      - name: Let Chromium's sandbox start
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # --no-check: this measures; it doesn't gate.
      - name: Market eval, measured
        run: node evals/market/run.mjs --no-check --out "evals/market/results/run-${{ matrix.run }}.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: market-run-${{ matrix.run }}
          path: evals/market/results/run-${{ matrix.run }}.json

  floors:
    needs: measure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: market-run-*
          merge-multiple: true
          path: runs

      - name: The worst of the 3 runs, as floors
        run: |
          node evals/market/check.mjs --raise runs/run-1.json runs/run-2.json runs/run-3.json --write
          git diff --stat -- evals/market/floors.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: market-floors
          path: |
            evals/market/floors.json
            runs/

[package]
name = "local-studio-computer"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Local Studio's computer-use helper for Linux: the hands protocol over stdio, AT-SPI for the tree and actions."
publish = false

[[bin]]
name = "local-studio-computer"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await", "async-await-macro"] }
x11rb = { version = "0.13", default-features = false }
png = "0.17"
libc = "0.2"
async-io = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Its own workspace, so the repository's Cargo.toml above doesn't claim it.
[workspace]
